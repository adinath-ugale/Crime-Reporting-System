<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="600" height="500" fill="url(#bgGlow)" rx="24"/>
  
  <!-- Network grid lines -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="50" y1="100" x2="550" y2="100" />
    <line x1="50" y1="250" x2="550" y2="250" />
    <line x1="50" y1="400" x2="550" y2="400" />
    <line x1="150" y1="50" x2="150" y2="450" />
    <line x1="450" y1="50" x2="450" y2="450" />
  </g>

  <!-- Central Shield Glow -->
  <circle cx="300" cy="220" r="160" fill="#3b82f6" opacity="0.08" />
  <circle cx="300" cy="220" r="110" fill="#2563eb" opacity="0.08" />

  <!-- Main Security Console Card -->
  <rect x="110" y="80" width="380" height="290" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)"/>
  
  <!-- Console Header Bar -->
  <path d="M110 96 A 16 16 0 0 1 126 80 L 474 80 A 16 16 0 0 1 490 96 L 490 120 L 110 120 Z" fill="#0f172a" />
  <circle cx="130" cy="100" r="4" fill="#ef4444" />
  <circle cx="145" cy="100" r="4" fill="#f59e0b" />
  <circle cx="160" cy="100" r="4" fill="#10b981" />
  <text x="210" y="104" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="1">CENTRAL CIVIC DISPATCH & MONITORING</text>

  <!-- Big Central Shield Badge -->
  <g transform="translate(250, 150)">
    <path d="M50 0 L90 18 C90 60 70 88 50 100 C30 88 10 60 10 18 Z" fill="url(#shieldFill)" stroke="#60a5fa" stroke-width="3"/>
    <!-- Scales & Check inside shield -->
    <path d="M50 24 L50 65 M34 38 L66 38 M30 52 L38 52 L34 38 Z M62 52 L70 52 L66 38 Z" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="30" r="3.5" fill="#f59e0b"/>
    <path d="M42 74 L48 80 L60 68" stroke="#10b981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Live Status Card Top Left -->
  <rect x="50" y="130" width="160" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="70" cy="155" r="8" fill="#dbeafe" />
  <path d="M66 155 L69 158 L75 152" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="86" y="152" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">CASE STATUS</text>
  <text x="86" y="170" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#16a34a">RESOLVED #9842</text>
  <rect x="86" y="178" width="80" height="4" rx="2" fill="#86efac"/>

  <!-- Rapid Response Badge Bottom Right -->
  <rect x="380" y="270" width="170" height="75" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="405" cy="298" r="8" fill="#fef3c7" />
  <path d="M405 293 L405 299 L409 301" stroke="#d97706" stroke-width="2" fill="none" stroke-linecap="round"/>
  <text x="422" y="295" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#64748b">DISPATCH TIME</text>
  <text x="422" y="313" font-family="-apple-system, sans-serif" font-size="13" font-weight="800" fill="#0f172a">&lt; 15 MIN AVG</text>
  <text x="422" y="328" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#10b981">● All Stations Active</text>

  <!-- Police Verification Seal Bottom Left -->
  <rect x="70" y="310" width="170" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#cardShadow)"/>
  <circle cx="95" cy="345" r="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <path d="M91 345 L94 348 L101 341" stroke="#2563eb" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="340" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Verified Police Portal</text>
  <text x="120" y="356" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#64748b">Authentic Audit Trail</text>

  <!-- Floating Stats Pill Bottom Center -->
  <rect x="200" y="390" width="200" height="44" rx="22" fill="#0f172a" filter="url(#cardShadow)"/>
  <circle cx="225" cy="412" r="5" fill="#22c55e" />
  <text x="238" y="416" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">99.8% Tracked Cases</text>
</svg>
