<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Hub | Crime Reporting System (CRS)</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="dashboard-layout">
    <!-- Dynamic Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="sidebar-brand">
          <img src="assets/logos/crs-logo.svg" alt="CRS Emblem" style="height: 38px; filter: brightness(0) invert(1);">
        </a>
      </div>

      <div class="sidebar-user-card">
        <div class="sidebar-user-avatar">U</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name user-display-name">Active User</div>
          <div class="sidebar-user-role user-display-role">Account</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="sidebar-section-label">Navigation</div>
        <ul class="sidebar-menu" id="dynamicNotifNavMenu">
          <!-- Populated by role -->
        </ul>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="btn btn-sm btn-outline logout-btn btn-block" style="border-color: rgba(255,255,255,0.2); color: #cbd5e1;">
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Workspace -->
    <div class="dashboard-main">
      <div class="dashboard-topbar">
        <div class="dashboard-topbar-left">
          <button type="button" class="sidebar-toggle-btn" aria-label="Toggle sidebar">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <span class="topbar-portal-badge badge-role-citizen">Alerts & Directives</span>
        </div>
        <div class="dashboard-topbar-right">
          <button type="button" class="btn btn-sm btn-outline" id="markAllReadBtn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
            Mark All as Read
          </button>
        </div>
      </div>

      <div class="dashboard-content">
        <div class="dashboard-page-header">
          <div>
            <h1 class="dashboard-page-title">Notification Center</h1>
            <p class="dashboard-page-subtitle">Real-time alerts regarding complaint verification, officer assignments, and investigation progress.</p>
          </div>
          <div class="flex gap-2">
            <button type="button" class="btn btn-sm btn-primary" id="notifFilterAll">All Notifications</button>
            <button type="button" class="btn btn-sm btn-outline" id="notifFilterUnread">Unread Only</button>
          </div>
        </div>

        <!-- Notifications Container -->
        <div id="notificationsList" class="container-narrow" style="margin-left: 0;">
          <div class="py-12 text-center text-muted">Loading alerts...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/notifications.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = AuthService.requireAuth();
      if (!user) return;

      const navMenu = document.getElementById('dynamicNotifNavMenu');
      if (user.role === 'citizen') {
        navMenu.innerHTML = `
          <li><a href="dashboard.html" class="sidebar-link"><span class="sidebar-link-content"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</span></a></li>
          <li><a href="report-crime.html" class="sidebar-link"><span class="sidebar-link-content"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>Report Crime</span></a></li>
          <li><a href="complaint-history.html" class="sidebar-link"><span class="sidebar-link-content"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>My Complaints</span></a></li>
          <li><a href="notifications.html" class="sidebar-link active"><span class="sidebar-link-content"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>Notifications</span></a></li>
          <li><a href="profile.html" class="sidebar-link"><span class="sidebar-link-content"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>Profile</span></a></li>
        `;
      } else {
        const dashLink = user.role === 'police' ? 'police-dashboard.html' : (user.role === 'incharge' ? 'incharge-dashboard.html' : 'official-dashboard.html');
        navMenu.innerHTML = `
          <li><a href="${dashLink}" class="sidebar-link"><span class="sidebar-link-content"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Dashboard</span></a></li>
          <li><a href="complaints-management.html" class="sidebar-link"><span class="sidebar-link-content"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>Complaints</span></a></li>
          <li><a href="investigation.html" class="sidebar-link"><span class="sidebar-link-content"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>Investigation</span></a></li>
          <li><a href="police-stations.html" class="sidebar-link"><span class="sidebar-link-content"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>Stations</span></a></li>
          <li><a href="notifications.html" class="sidebar-link active"><span class="sidebar-link-content"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>Notifications</span></a></li>
        `;
      }

      NotificationsCenter.initNotifications();
    });
  </script>
</body>
</html>
